backend:
  name: turbo-github
  turbo_site_id: 65949689-10c2-4bab-8e0d-5ea7aa1a3a8d
  branch: development

publish_mode: editorial_workflow

media_folder: "content/uploads"

collections:
  # ---------------------------------------------------------------- TRACKS
  - name: tracks
    label: Tracks
    label_singular: Track
    folder: content/tracks
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{fields.track_id}}"
    identifier_field: title
    summary: "{{fields.display_order}} · {{title}}"
    sortable_fields: [display_order, title]
    editor: { preview: false }
    fields:
      - { label: Track ID, name: track_id, widget: string, pattern: ['^[a-z0-9_]+$', 'Lowercase letters, digits, underscores'], hint: "e.g. track_a. Becomes the filename and is referenced by units. Do not change after creation." }
      - { label: Title, name: title, widget: string, hint: "e.g. Regulate & Recover" }
      - { label: Epigraph quote, name: epigraph_quote, widget: text, required: false, hint: "Optional quotation shown with the track. Fill in the author too" }
      - { label: Epigraph author, name: epigraph_author, widget: string, required: false, hint: "Required when there is a quote" }
      - { label: Display order, name: display_order, widget: number, value_type: int, min: 1 , hint: "The sorting order when all tracks are listed"}
      - { label: Overview, name: body, widget: markdown }
      - label: Routing
        name: routing
        widget: code
        default_language: json
        output_code_only: true
        required: false
        hint: 'JSON, evaluated by the backend. The rules that make this track a candidate for a user, in the same condition format as variants, e.g. {"metric_threshold": ["stress", ">", 3]} or {"modifier_threshold": ["door.improve", ">=", 1]}. Leave empty for no rules.'
 
  # ---------------------------------------------------------------- UNITS
  - name: units
    label: Units
    label_singular: Unit
    folder: content/units
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{fields.unit_id}}"
    identifier_field: title
    summary: "{{fields.unit_id}} · {{title}}"
    sortable_fields: [unit_id, title]
    view_groups:
      - { label: Track, field: track }
    editor: { preview: false }
    fields:
      - { label: Unit ID, name: unit_id, widget: string, pattern: ['^[a-z0-9_]+$', 'Lowercase letters, digits, underscores'], hint: "e.g. track_a_unit_1. Becomes the filename. Do not change after creation." }
      - { label: Track, name: track, widget: relation, collection: tracks, value_field: track_id, search_fields: [title, track_id], display_fields: [title] }
      - { label: Unit number, name: unit_number, widget: number, value_type: int, min: 1 }
      - { label: Title, name: title, widget: string, hint: "e.g. First, Safety" }
      - { label: Subtitle, name: subtitle, widget: string, required: false, hint: "e.g. What am I actually feeling?" }
      - { label: Epigraph quote, name: epigraph_quote, widget: text, required: false, hint: "Optional quotation shown at the top of the unit" }
      - { label: Epigraph author, name: epigraph_author, widget: string, required: false }
      - { label: Outcome statement, name: outcome, widget: text, required: false, hint: "Optional. Shown after the intro text and on the unit card, e.g. 'By the end of the unit...'" }
      - { label: Has intro screen, name: has_intro, widget: boolean, default: true, hint: "The intro is not a session" }
      - { label: Intro screen text, name: body, widget: markdown, required: false, hint: "Use ## headings for the intro sections. Do not repeat the outcome statement here." }
 
  # ---------------------------------------------------------------- SESSIONS
  - name: sessions
    label: Sessions
    label_singular: Session
    folder: content/sessions
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{fields.session_id}}"
    identifier_field: title
    summary: "{{fields.session_id}} · {{title}}"
    sortable_fields: [session_id, title]
    view_groups:
      - { label: Unit, field: unit }
      - { label: Session type, field: session_type }
    editor: { preview: false }
    fields:
      # ---- identity & behaviour
      - { label: Session ID, name: session_id, widget: string, pattern: ['^[a-z0-9_]+$', 'Lowercase letters, digits, underscores'], hint: "e.g. track_a_u1_s2. Becomes the filename. Do not change after creation." }
      - { label: Unit, name: unit, widget: relation, collection: units, value_field: unit_id, search_fields: [title, unit_id], display_fields: [unit_id, title] }
      - { label: Session number, name: session_number, widget: number, value_type: int, min: 1 }
      - label: Session type
        name: session_type
        widget: select
        options:
          - { label: "Learn", value: learn }
          - { label: "Practice", value: practice }
          - { label: "Experiment", value: experiment }
          - { label: "Review", value: review }
      - label: Category
        name: session_category
        widget: select
        required: false
        options: [open, deepen, build, practice, reflect]
      - { label: Title, name: title, widget: string, hint: "e.g. Why we start here" }
      - { label: Session label, name: session_label, widget: string, required: false, hint: "Display label for the kind of session, e.g. LEARN, ZONE 2, TECHNICAL DRILL, INTERVALS, REAL-WORLD REP" }
      - { label: Subtitle, name: subtitle, widget: string, required: false, hint: "e.g. Physical Sensations & Emotional Information" }
      - { label: Estimated minutes, name: estimated_minutes, widget: number, value_type: int, min: 1, hint: "Lower end if the session shows a range such as 8-10" }
      - { label: Estimated minutes (upper end of range), name: estimated_minutes_max, widget: number, value_type: int, min: 1, required: false }
      - { label: Time label override, name: time_label, widget: string, required: false, hint: "Only if the time is not a simple range, e.g. '5 minutes in-app, rest in the world'" }
      - { label: Session format summary, name: format_summary, widget: string, required: false, hint: "e.g. Learn → Exercise → Review" }
      - label: Included in track lengths
        name: lengths
        widget: select
        multiple: true
        min: 1
        default: [short, medium, full]
        options:
          - { label: Short, value: short }
          - { label: Medium, value: medium }
          - { label: Full, value: full }
        hint: "Which versions of the track include this session. Untick a length to leave the session out of it, e.g. Medium + Full but not Short"
      - { label: Evidence, name: evidence, widget: markdown, required: false, buttons: [bold, italic, link], hint: "Optional citation or research basis for this session. Shown behind an icon, separate from the session text" }
 
      # ---- LEARN / REVIEW: ordered content blocks (also used inside practice sections)
      - &blocks
        label: Content blocks
        name: blocks
        widget: list
        required: false
        hint: "Ordered top to bottom exactly as the user sees them"
        types:
          - label: Text
            name: text
            widget: object
            summary: "{{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Style, name: style, widget: select, default: normal, options: [normal, callout, note, scenario, example, science, excavating, anchoring, carry] }
              - { label: Body, name: body, widget: markdown }
 
          - label: Section divider
            name: section
            widget: object
            summary: "{{fields.phase}}"
            hint: "Marks a phase inside a session (e.g. OPEN, DEEPEN, BUILD). Blocks that follow belong to it until the next divider"
            fields:
              - { label: Phase, name: phase, widget: select, options: [{ label: Open, value: open }, { label: Deepen, value: deepen }, { label: Build, value: build }, { label: Other (use the label), value: other }] }
              - { label: Label override, name: label, widget: string, required: false, hint: "Display text if different from the phase name, or when Phase is Other" }
 
          - label: Expandable section
            name: expandable
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Section ID, name: section_id, widget: string, pattern: ['^[a-z0-9_]+$', 'Lowercase letters, digits, underscores'], hint: "e.g. w1_d3_expandable_variations. Open/closed state is stored per user against this ID" }
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: markdown }
 
          - label: Show user's earlier answer
            name: recall
            widget: object
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string, hint: "e.g. This morning you said:" }
              - label: Questions to display
                name: question_ids
                widget: list
                field: { label: Question, name: question_id, widget: relation, collection: questions, value_field: question_id, search_fields: [prompt, question_id], display_fields: [question_id, prompt] }

          - label: Question
            name: question
            widget: object
            summary: "{{fields.question_id}}"
            hint: "A question the user answers here. Questions are written once under Questions and placed in sessions or questionnaires by reference"
            fields:
              - { label: Question, name: question_id, widget: relation, collection: questions, value_field: question_id, search_fields: [prompt, question_id], display_fields: [question_id, prompt] }

          - label: Check-in
            name: check_in
            widget: object
            summary: "{{fields.question_id}}"
            hint: "Attaches a check-in to this session: a question the app asks later as a notification, outside the session order (e.g. after the user has practised in real life). It is not shown in the session itself and never blocks progress"
            fields:
              - { label: Check-in question, name: question_id, widget: relation, collection: questions, value_field: question_id, search_fields: [prompt, question_id], display_fields: [question_id, prompt] }


  # ---------------------------------------------------------------- QUESTIONS
  # Every question is written once here and referenced by ID from session blocks and questionnaires.
  # A question can change any number of metrics and modifiers on the user's profile. Both are numbers; they differ only in category.
  # Choice questions: each option carries its own effects. Scale questions: each effect has a weight applied to the chosen value.
  - name: questions
    label: Questions
    label_singular: Question
    folder: content/questions
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{fields.question_id}}"
    identifier_field: prompt
    summary: "{{fields.question_id}} · {{prompt}}"
    sortable_fields: [question_id]
    view_groups:

      - { label: Type, field: type }
    editor: { preview: false }
    fields:
      - { label: Question ID, name: question_id, widget: string, pattern: ['^[A-Za-z0-9_]+$', 'Letters, digits, underscores'], hint: "e.g. d_w2_d3_bring. Becomes the filename. Answers are stored against it. Never rename after launch." }
      - label: Type
        name: type
        widget: select
        default: text
        options:
          - { label: Free text, value: text }
          - { label: Single select (radio), value: single_select }
          - { label: Multi select (checkboxes), value: multi_select }
          - { label: Toggle (yes/no), value: toggle }
          - { label: Dropdown, value: dropdown }
          - { label: "Scale (e.g. 1-5, 1-10)", value: scale }
          - { label: Date, value: date }
      - { label: Prompt, name: prompt, widget: text }
      - { label: Help text, name: help, widget: text, required: false }
      - { label: Placeholder, name: placeholder, widget: string, required: false, hint: "Free text only" }
      - { label: Scale minimum, name: scale_min, widget: number, value_type: int, default: 1, required: false, hint: "Scale only" }
      - { label: Scale maximum, name: scale_max, widget: number, value_type: int, min: 2, required: false, hint: "Scale only, e.g. 5 or 10" }
      - { label: Scale step, name: scale_step, widget: number, value_type: float, min: 0, default: 1, required: false, hint: "Scale only. Increment between values, e.g. 0.5 to allow 7.5. Default 1. The range must divide into whole steps" }
      - { label: Label for minimum, name: scale_min_label, widget: string, required: false, hint: "Scale only, e.g. not confident" }
      - { label: Label for maximum, name: scale_max_label, widget: string, required: false, hint: "Scale only, e.g. very confident" }
      - label: Label for every point
        name: scale_labels
        widget: list
        required: false
        hint: "Scale only. Optional: one label per point in order starting at the minimum. Overrides the min/max labels"
        field: { label: Point label, name: point_label, widget: string }
      - { label: Maximum choices, name: max_selections, widget: number, value_type: int, min: 1, required: false, hint: "Multi select only. The most options the user can tick. Leave empty for no limit" }
      - label: Options
        name: options
        widget: list
        required: false
        summary: "{{fields.label}}"
        hint: "Single select, multi select, toggle and dropdown only. The answer is stored as the option Value, not its position or label, so labels can be reworded and options added, removed or reordered after launch. Never change a Value once answers exist"
        fields:
          - { label: Value, name: value, widget: string, pattern: ['^[a-z0-9_]+$', 'Lowercase letters, digits, underscores'], hint: "e.g. a_bit_tense. This is what is saved with the answer. Unique within the question. Never change it once answers exist" }
          - { label: Label, name: label, widget: string, hint: "What the user sees. Can be reworded at any time" }
          - label: Metric effects
            name: metric_effects
            widget: list
            required: false
            summary: "{{fields.metric}} {{fields.score}}"
            hint: "Choosing this option adds each score to its metric on the user's profile. Several metrics can be affected. Use a negative score to lower one. For multi select, the scores of all ticked options are added"
            fields:
              - { label: Metric, name: metric, widget: select, options: &metric_options [{ label: Stress, value: stress }, { label: Anxiety, value: anxiety }, { label: Trait C - Conscientiousness, value: trait_C_conscientiousness }, { label: Trait N - Neuroticism, value: trait_N_neuroticism }, { label: Emotional sensitivity, value: emotional_sensitivity }, { label: Goal alignment, value: goal_alignment }, { label: Relationship satisfaction, value: relationship_satisfaction }, { label: Trait A - Agreeableness, value: trait_A_agreeableness }, { label: Trait E - Extraversion, value: trait_E_extraversion }, { label: Trait I - Openness (intellect/imagination), value: trait_I_openness }, { label: Drive, value: drive }, { label: Self-efficacy, value: self_efficacy }, { label: PSS, value: pss }, { label: GAD, value: gad }, { label: PHQ, value: phq }, { label: Physical Health, value: physical_health }, { label: Work-Life Balance, value: work_life_balance }, { label: Close Relationships, value: close_relationships }, { label: Community and Belonging, value: community_and_belonging }, { label: Others first, value: others_first }, { label: Perceived stress, value: perceived_stress }, { label: Low mood and interest, value: low_mood_interest }, { label: Area satisfaction - Romantic relationship, value: area_satisfaction.romantic_relationship }, { label: Area satisfaction - Family, value: area_satisfaction.family }, { label: Area satisfaction - Friends, value: area_satisfaction.friends }, { label: PHQ-4 total, value: phq4_total }, { label: Sleep quality, value: sleep_quality }, { label: Wellbeing (WHO-5), value: wellbeing_who5 }, { label: Stress - Control, value: stress_control }, { label: Worry and tension, value: worry_tension }, { label: Daily functioning, value: daily_functioning }, { label: Sleep hours, value: sleep_hours }, { label: Avoid feelings, value: avoid_feelings }, { label: Optimism, value: optimism }, { label: Self-blame, value: self_blame }, { label: Sense of self, value: sense_of_self }, { label: Confidence to change, value: confidence_to_change }, { label: Easier to give than ask, value: give_ask }, { label: Giving when running on empty, value: give_empty }, { label: Told I take on too much, value: give_told }, { label: Lonely, value: lonely }, { label: Time matches values, value: time_matches_values }, { label: Stuck, value: stuck }, { label: Routines work, value: routines_work }, { label: Follow-through, value: follow_through }, { label: Area satisfaction - Physical health, value: area_satisfaction.physical_health }, { label: Area satisfaction - Work or study, value: area_satisfaction.work_or_study }, { label: Area satisfaction - Money and security, value: area_satisfaction.money_and_security }, { label: Area satisfaction - Leisure and rest, value: area_satisfaction.leisure_and_rest }, { label: Area satisfaction - Personal growth, value: area_satisfaction.personal_growth }], hint: "The list mirrors the database and is changed by a developer" }
              - { label: Score, name: score, widget: number, value_type: float }
          - label: Modifier effects
            name: modifier_effects
            widget: list
            required: false
            summary: "{{fields.modifier}} {{fields.score}}"
            hint: "Same as metric effects, for modifiers on the user's profile"
            fields:
              - { label: Modifier, name: modifier, widget: select, options: &modifier_options [{ label: Disruption, value: disruption }, { label: Area importance - Romantic relationship, value: area_importance.romantic_relationship }, { label: Area importance - Family, value: area_importance.family }, { label: Area importance - Friends, value: area_importance.friends }, { label: Door - Improve, value: door.improve }, { label: Door - Change, value: door.change }, { label: Door - Support, value: door.support }, { label: Door - Curious, value: door.curious }, { label: Area importance - Physical health, value: area_importance.physical_health }, { label: Area importance - Work or study, value: area_importance.work_or_study }, { label: Area importance - Money and security, value: area_importance.money_and_security }, { label: Area importance - Leisure and rest, value: area_importance.leisure_and_rest }, { label: Area importance - Personal growth, value: area_importance.personal_growth }, { label: Area not relevant - Physical health, value: area_not_relevant.physical_health }, { label: Area not relevant - Work or study, value: area_not_relevant.work_or_study }, { label: Area not relevant - Money and security, value: area_not_relevant.money_and_security }, { label: Area not relevant - Romantic relationship, value: area_not_relevant.romantic_relationship }, { label: Area not relevant - Family, value: area_not_relevant.family }, { label: Area not relevant - Friends, value: area_not_relevant.friends }, { label: Area not relevant - Leisure and rest, value: area_not_relevant.leisure_and_rest }, { label: Area not relevant - Personal growth, value: area_not_relevant.personal_growth }, { label: Chosen skill - Recover and recharge, value: chosen_skills.recover_and_recharge }, { label: Chosen skill - Handle emotions, value: chosen_skills.handle_emotions }, { label: Chosen skill - Understand myself, value: chosen_skills.understand_myself }, { label: Chosen skill - Relationships boundaries, value: chosen_skills.relationships_boundaries }, { label: Chosen skill - Meaning direction, value: chosen_skills.meaning_direction }, { label: Chosen skill - Habits that stick, value: chosen_skills.habits_that_stick }, { label: Chosen skill - Not sure, value: chosen_skills.not_sure }, { label: Chosen situation - Before hard conversation, value: chosen_situations.before_hard_conversation }, { label: Chosen situation - Thoughts race at night, value: chosen_situations.thoughts_race_at_night }, { label: Chosen situation - After long workday, value: chosen_situations.after_long_workday }, { label: Chosen situation - Feel overwhelmed, value: chosen_situations.feel_overwhelmed }, { label: Chosen situation - Say yes mean no, value: chosen_situations.say_yes_mean_no }, { label: Chosen situation - Lose motivation, value: chosen_situations.lose_motivation }, { label: Chosen situation - Stuck on decision, value: chosen_situations.stuck_on_decision }, { label: Chosen situation - People who drain me, value: chosen_situations.people_who_drain_me }, { label: Chosen situation - Plan falls apart, value: chosen_situations.plan_falls_apart }, { label: Chosen situation - Mornings, value: chosen_situations.mornings }, { label: Chosen situation - Criticised, value: chosen_situations.criticised }, { label: Chosen situation - Enjoy good moment, value: chosen_situations.enjoy_good_moment }, { label: Stress duration - A few days, value: stress_duration.a_few_days }, { label: Stress duration - A few weeks, value: stress_duration.a_few_weeks }, { label: Stress duration - A few months, value: stress_duration.a_few_months }, { label: Stress duration - Longer, value: stress_duration.longer }, { label: Stress duration - Not sure, value: stress_duration.not_sure }, { label: Stress from - Physical health, value: stress_areas.physical_health }, { label: Stress from - Work or study, value: stress_areas.work_or_study }, { label: Stress from - Money and security, value: stress_areas.money_and_security }, { label: Stress from - Romantic relationship, value: stress_areas.romantic_relationship }, { label: Stress from - Family, value: stress_areas.family }, { label: Stress from - Friends, value: stress_areas.friends }, { label: Stress from - Leisure and rest, value: stress_areas.leisure_and_rest }, { label: Stress from - Personal growth, value: stress_areas.personal_growth }, { label: Stress from - Hard to say, value: stress_areas.hard_to_say }, { label: Stress from - Prefer not to say, value: stress_areas.prefer_not_to_say }, { label: Stress expected to last - Passes soon, value: stress_expected_to_last.passes_soon }, { label: Stress expected to last - Ongoing, value: stress_expected_to_last.ongoing }, { label: Stress expected to last - Unsure, value: stress_expected_to_last.unsure }, { label: Support elsewhere - Yes, value: support_elsewhere.yes }, { label: Support elsewhere - No, value: support_elsewhere.no }, { label: Support elsewhere - Prefer not to say, value: support_elsewhere.prefer_not_to_say }, { label: Relationship strain - Conflict, value: relationship_strain_kind.conflict }, { label: Relationship strain - Over giving, value: relationship_strain_kind.over_giving }, { label: Relationship strain - Lonely, value: relationship_strain_kind.lonely }, { label: Relationship strain - Own reactions, value: relationship_strain_kind.own_reactions }, { label: Relationship strain - Unsure, value: relationship_strain_kind.unsure }, { label: Low mood kind - Flat, value: low_mood_kind.flat }, { label: Low mood kind - Stuck, value: low_mood_kind.stuck }, { label: Low mood kind - Hard time, value: low_mood_kind.hard_time }, { label: Low mood kind - Lonely, value: low_mood_kind.lonely }, { label: Low mood kind - Unsure, value: low_mood_kind.unsure }, { label: State vs usual, value: state_vs_usual }, { label: Energy for something new, value: energy_for_new }, { label: Practice minutes, value: practice_minutes }, { label: Sessions per week, value: sessions_per_week }, { label: Start style, value: start_style }, { label: Emotion naming, value: emotion_naming }, { label: Life change, value: life_change }], hint: "The list mirrors the database and is changed by a developer" }
              - { label: Score, name: score, widget: number, value_type: float }
          - { label: Shows a text field when chosen ("Other"), name: has_text_field, widget: boolean, default: false }
          - { label: Exclusive (clears the other choices when picked), name: is_exclusive, widget: boolean, default: false, hint: "Multi select only" }
      - label: Scale metric effects
        name: scale_metric_effects
        widget: list
        required: false
        summary: "{{fields.metric}} x {{fields.weight}}"
        hint: "Scale only. The chosen value is multiplied by the weight and added to the metric. Several metrics can be affected. Weight 1 adds the value itself, 0.5 half of it, -1 subtracts it"
        fields:
          - { label: Metric, name: metric, widget: select, options: *metric_options }
          - { label: Weight, name: weight, widget: number, value_type: float }
      - label: Scale modifier effects
        name: scale_modifier_effects
        widget: list
        required: false
        summary: "{{fields.modifier}} x {{fields.weight}}"
        hint: "Scale only. Same as scale metric effects, for modifiers"
        fields:
          - { label: Modifier, name: modifier, widget: select, options: *modifier_options }
          - { label: Weight, name: weight, widget: number, value_type: float }
      - { label: Follow-up question, name: follow_up, widget: relation, collection: questions, value_field: question_id, search_fields: [prompt, question_id], display_fields: [question_id, prompt], required: false, hint: "Asked after this one, e.g. 'What happened?' after a toggle" }
      - label: Follow-up conditions
        name: follow_up_conditions
        widget: code
        default_language: json
        output_code_only: true
        required: false
        hint: 'JSON, evaluated by the backend. The follow-up question is only asked when these conditions are true. Leave empty to always ask it. Follow-up questions are not placed in session blocks or questionnaires.'

      - label: Notification
        name: notification
        widget: object
        required: false
        hint: "Only for check-in questions: the text of the notification that asks this question"
        fields:
          - { label: Title, name: title, widget: string, required: false, hint: "e.g. Time for your practice" }
          - { label: Message, name: message, widget: text, required: false, hint: "e.g. Did you get to it today?" }
  # ---------------------------------------------------------------- QUESTIONNAIRES
  # A questionnaire is an ordered list of questions, optionally followed by an assessment.
  - name: questionnaires
    label: Questionnaires
    label_singular: Questionnaire
    folder: content/questionnaires
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{fields.questionnaire_id}}"
    identifier_field: title
    summary: "{{fields.questionnaire_id}} · {{title}}"
    editor: { preview: false }
    fields:
      - { label: Questionnaire ID, name: questionnaire_id, widget: string, pattern: ['^[a-z0-9_]+$', 'Lowercase letters, digits, underscores'], hint: "e.g. onboarding or track_a_review. Becomes the filename. Do not change after creation." }
      - { label: Title, name: title, widget: string }
      - { label: Opening text, name: body, widget: markdown, required: false, hint: "Shown before the first question" }
      - label: Questions
        name: questions
        widget: list
        summary: "{{fields.question_id}}"
        hint: "In the order the user sees them"
        field: { label: Question, name: question_id, widget: relation, collection: questions, value_field: question_id, search_fields: [prompt, question_id], display_fields: [question_id, prompt] }
      - { label: Assessment, name: assessment, widget: relation, collection: assessments, value_field: assessment_id, search_fields: [title, assessment_id], display_fields: [title], required: false, hint: "The result shown after the last question" }

  # ---------------------------------------------------------------- ASSESSMENTS
  # An assessment is the result shown after a questionnaire: fixed texts and variant sets, top to bottom.
  - name: assessments
    label: Assessments
    label_singular: Assessment
    folder: content/assessments
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{fields.assessment_id}}"
    identifier_field: title
    summary: "{{fields.assessment_id}} · {{title}}"
    editor: { preview: false }
    fields:
      - { label: Assessment ID, name: assessment_id, widget: string, pattern: ['^[a-z0-9_]+$', 'Lowercase letters, digits, underscores'], hint: "e.g. onboarding. Becomes the filename and is referenced by questionnaires. Do not change after creation." }
      - { label: Title, name: title, widget: string }
      - label: Blocks
        name: blocks
        widget: list
        hint: "Shown top to bottom in this order"
        types:
          - label: Fixed text
            name: text
            widget: object
            summary: "{{fields.heading}}"
            hint: "Shown to every user, e.g. a bridge line between variant sets"
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Text, name: body, widget: markdown }

          - label: Variant set
            name: variant_set
            widget: object
            summary: "{{fields.label}} · {{fields.show}}"
            hint: "Alternative texts. Each variant scores from its conditions against the user's profile"
            fields:
              - { label: Label, name: label, widget: string, hint: "Editor-only name, e.g. Hook" }
              - label: Show
                name: show
                widget: select
                default: winner_only
                options:
                  - { label: "Only the highest scoring variant", value: winner_only }
                  - { label: "Only the lowest scoring variant", value: loser_only }
                  - { label: "All variants", value: all }
              - { label: Variants, name: variants, widget: relation, collection: variants, value_field: variant_id, search_fields: [name, variant_id, text], display_fields: [variant_id, name], multiple: true }

  # ---------------------------------------------------------------- VARIANTS
  # A variant is one alternative text plus its conditions as JSON. The backend does all scoring.
  - name: variants
    label: Variants
    label_singular: Variant
    folder: content/variants
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{fields.variant_id}}"
    identifier_field: variant_id
    summary: "{{fields.variant_id}} · {{name}}"
    sortable_fields: [variant_id, name]
    view_groups:
      - { label: Name, field: name }
    editor: { preview: false }
    fields:
      - { label: Variant ID, name: variant_id, widget: string, pattern: ['^[A-Z0-9_]+$', 'Upper case, digits, underscores, e.g. HOOK_01'], hint: "Becomes the filename. Do not change after creation." }
      - { label: Name, name: name, widget: string, hint: "The kind of text, e.g. Hook" }
      - { label: Text, name: text, widget: text, hint: "Blank line = new paragraph" }
      - label: Conditions
        name: conditions
        widget: code
        default_language: json
        output_code_only: true
        required: false
        hint: 'JSON, evaluated by the backend. Examples: {"metric_threshold": ["stress", ">", 3]}  {"modifier_threshold": ["door.improve", ">=", 1]}  {"and": [ ... ]}  {"or": [ ... ]}  {"not": { ... }}. Several conditions: put them in a JSON list. A variant is shown only when its conditions score; see design/content-conditions.md.'
        