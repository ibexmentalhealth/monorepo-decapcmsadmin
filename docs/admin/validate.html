<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content validation</title>
<style>
  :root { color-scheme: light dark; --bad: #b3261e; --ok: #1b7f3b; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  .summary { font-size: 1.1rem; font-weight: 600; }
  .valid { color: var(--ok); }
  .invalid, .problem { color: var(--bad); }
  .file { margin: 1.2rem 0 0.3rem; font-family: ui-monospace, monospace; font-weight: 600; word-break: break-all; }
  ul { margin: 0; padding-left: 1.2rem; }
  li { margin: 0.3rem 0; }
  code { font-family: ui-monospace, monospace; background: rgba(127,127,127,.18); padding: 0 .3em; border-radius: 3px; }
  .rule { opacity: .6; font-size: .85em; }
  details { margin-top: 2rem; }
  pre { overflow-x: auto; }
  input, button { font: inherit; }
  input { min-width: 16rem; }
</style>
</head>
<body>
<h1>Content validation</h1>
<p id="meta"></p>
<p id="status" class="summary"></p>
<form id="keyForm" hidden>
  <label>Validation key <input id="key" type="password" autocomplete="off" required></label>
  <button>Save and check</button>
</form>
<div id="files"></div>
<p><button id="again" hidden>Check again</button> <button id="forget" hidden>Change key</button></p>
<details id="raw" hidden><summary>Raw JSON</summary><pre id="json"></pre></details>

<script>
// Put this file in the Decap admin repo. The key is given to editors by an admin; it is stored only in this
// browser's localStorage and sent only to API_URL.
const API_URL = 'https://dev-api.ibexmentalfitness.com';
const STORAGE_KEY = 'content-validation-key';

const $ = (id) => document.getElementById(id);
const el = (tag, text, className) => {
  const node = document.createElement(tag);
  node.textContent = text; // textContent only: messages contain content from the CMS files
  if (className) node.className = className;
  return node;
};
const show = (message, className) => {
  $('status').textContent = message;
  $('status').className = `summary ${className}`;
};
const askForKey = (message) => {
  show(message, 'problem');
  $('keyForm').hidden = false;
  $('again').hidden = true;
  $('forget').hidden = true;
};

async function run() {
  $('files').replaceChildren();
  $('raw').hidden = true;
  $('keyForm').hidden = true;
  $('meta').textContent = '';
  const key = localStorage.getItem(STORAGE_KEY);
  if (!key) return askForKey('Enter the validation key you were given.');

  show('Checking…', '');
  let res;
  try {
    res = await fetch(`${API_URL}/internal/content-validation`, { headers: { authorization: `Bearer ${key}` } });
  } catch {
    $('again').hidden = false;
    return show('Could not reach the API. It may be down outside its running hours (08:00 to 22:00).', 'problem');
  }
  if (res.status === 401) {
    localStorage.removeItem(STORAGE_KEY);
    return askForKey('The key was not accepted. Enter the current validation key.');
  }
  $('again').hidden = false;
  $('forget').hidden = false;
  if (!res.ok) return show(`The API answered with an error (${res.status}). Try again in a minute.`, 'problem');

  const body = await res.json();
  $('meta').textContent = `${body.repo} @ ${body.ref}`;
  show(body.summary, body.valid ? 'valid' : 'invalid');
  for (const { file, errors } of body.files) {
    $('files').append(el('div', file, 'file'));
    const list = document.createElement('ul');
    for (const { field, rule, message } of errors) {
      const item = document.createElement('li');
      if (field) item.append(el('code', field), ' ');
      item.append(message, ' ', el('span', `(${rule})`, 'rule'));
      list.append(item);
    }
    $('files').append(list);
  }
  $('json').textContent = JSON.stringify(body, null, 2);
  $('raw').hidden = false;
}

$('keyForm').addEventListener('submit', (event) => {
  event.preventDefault();
  localStorage.setItem(STORAGE_KEY, $('key').value.trim());
  $('key').value = '';
  run();
});
$('again').addEventListener('click', run);
$('forget').addEventListener('click', () => {
  localStorage.removeItem(STORAGE_KEY);
  run();
});
run();
</script>
</body>
</html>
